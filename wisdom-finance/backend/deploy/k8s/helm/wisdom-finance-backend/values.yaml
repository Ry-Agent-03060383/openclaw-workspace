apiVersion: v1
kind: Namespace
metadata:
  name: wisdom-finance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisdom-finance-backend
  namespace: wisdom-finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wisdom-finance-backend
  template:
    metadata:
      labels:
        app: wisdom-finance-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ry-agent-03060383/wisdom-finance-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/wf
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: dbPwd
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wisdom-finance-backend
  namespace: wisdom-finance
spec:
  selector:
    app: wisdom-finance-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
