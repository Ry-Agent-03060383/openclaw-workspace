name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ['wisdom-finance/frontend/**']
  pull_request:
    branches: [main]
    paths: ['wisdom-finance/frontend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisdom-finance/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wisdom-finance/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
