name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ['wisdom-finance/backend/**']
  pull_request:
    branches: [main]
    paths: ['wisdom-finance/backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisdom-finance/backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn compile --no-transfer-progress

      - name: Run tests
        run: mvn test --no-transfer-progress

      - name: Generate JaCoCo report
        run: mvn jacoco:report --no-transfer-progress

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: wisdom-finance/backend/target/site/jacoco/
